# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the toolchain image, proves it by building the port's title, and publishes it to
# ghcr.io/<owner-lowercase>/pokemmo-ps5-buildenv on the default branch. A monthly rebuild catches upstream downloads that
# disappear (every download is pinned and checksum-verified, so a rebuild never changes versions silently).
name: image

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; the owner name may not be (Shabbypenguin).
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/pokemmo-ps5-buildenv" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build image
        run: docker build -t "$IMAGE:ci" -f docker/Dockerfile .

      # PokeMMO-Prospero is private for now, so reading it needs the PROSPERO_READ_TOKEN secret (a fine-grained
      # token with read-only Contents on that one repository; see docs/maintainers.md). Once the repo is public
      # the secret can be deleted and the built-in token is used instead.
      - name: Check out the port (same owner)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PokeMMO-Prospero
          token: ${{ secrets.PROSPERO_READ_TOKEN || github.token }}
          path: port

      - name: Smoke test - build the title and its image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/port:/work" -w /work "$IMAGE:ci" bash -c "make loader && make image-loader"
          test -s port/dist/pokemmo-prospero-loader-PPSA98001.zip
          test -s port/dist/PPSA98001.ffpfsc

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker tag "$IMAGE:ci" "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
